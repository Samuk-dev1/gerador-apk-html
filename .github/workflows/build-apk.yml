name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar projeto
      uses: actions/checkout@v4

    - name: Configurar Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Configurar e Gerar APK
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        
        # Cria uma pasta www caso seu projeto não tenha e garante um index.html básico
        mkdir -p www
        if [ ! -f "www/index.html" ]; then
          echo "<html><body><h1>Meu App</h1></body></html>" > www/index.html
        fi

        npx cap init MeuApp com.meuapp.gerador --web-dir www
        npx cap add android

    - name: Compilar APK
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Salvar APK
      uses: actions/upload-artifact@v4
      with:
        name: meu-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
