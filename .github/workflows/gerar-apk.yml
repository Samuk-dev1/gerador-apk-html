name: Gerar APK Prático

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nome do Aplicativo'
        required: true
        default: 'MeuApp'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar codigo do projeto
      uses: actions/checkout@v4

    - name: Configurar Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Preparar Projeto e Capacitor
      run: |
        npm init -y
        npm install @capacitor/core@5 @capacitor/android@5 @capacitor/cli@5
        
        mkdir -p www
        if [ -f index.html ]; then
          cp index.html www/index.html
        else
          echo "<html><body><h1>App</h1></body></html>" > www/index.html
        fi
        
        APP_NAME="${{ github.event.inputs.app_name }}"
        npx cap init "$APP_NAME" com.gerador.app --web-dir www
        npx cap add android
        npx cap sync android

    - name: Aplicar Nome do App
      run: |
        APP_NAME="${{ github.event.inputs.app_name }}"
        STRINGS_FILE="android/app/src/main/res/values/strings.xml"
        if [ -f "$STRINGS_FILE" ]; then
          sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$APP_NAME<\/string>/" "$STRINGS_FILE"
        fi

    - name: Compilar APK de Debug
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Salvar o APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: meu-aplicativo-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
