name: Gerar APK Prático

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar codigo do projeto
      uses: actions/checkout@v4

    - name: Configurar Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Preparar Ambiente e Gerar
      run: |
        npm init -y
        
        # Aqui está o segredo: instalando a versão 5 (Estável) que não tem o bug do Kotlin
        npm install @capacitor/core@5 @capacitor/android@5 @capacitor/cli@5
        
        mkdir -p www
        cp index.html www/index.html
        
        npx cap init MeuApp com.meuapp.gerador --web-dir www
        npx cap add android
        npx cap sync android

    - name: Compilar APK de Debug
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Salvar o APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: meu-aplicativo-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
