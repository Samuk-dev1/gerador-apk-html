name: Gerar APK Prático

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nome do Aplicativo'
        required: true
        default: 'MeuApp'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar codigo do projeto
      uses: actions/checkout@v4

    - name: Configurar Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Preparar Ambiente e Gerar
      run: |
        npm init -y
        
        # Instalando a versão 5 do Capacitor
        npm install @capacitor/core@5 @capacitor/android@5 @capacitor/cli@5
        
        mkdir -p www
        cp index.html www/index.html
        
        npx cap init MeuApp com.meuapp.gerador --web-dir www
        npx cap add android
        npx cap sync android

    - name: Aplicar Logo Personalizada se existir
      run: |
        if [ -f logo.png ]; then
          echo "Logo encontrada! Aplicando como icone do aplicativo..."
          # Substitui os ícones padrão do Android (ic_launcher) pela logo enviada pelo usuário em todas as densidades
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            if [ -d "android/app/src/main/res/mipmap-$d" ]; then
              cp logo.png android/app/src/main/res/mipmap-$d/ic_launcher.png
              cp logo.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
              cp logo.png android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png
            fi
          done
        else
          echo "Nenhuma logo enviada, mantendo icone padrao."
        fi

    - name: Compilar APK de Debug
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Salvar o APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: meu-aplicativo-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
