name: Gerar APK Prático

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nome do Aplicativo'
        required: true
        default: 'MeuApp'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar codigo do projeto
      uses: actions/checkout@v4

    - name: Configurar Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Preparar Ambiente e Gerar
      run: |
        npm init -y
        npm install @capacitor/core@5 @capacitor/android@5 @capacitor/cli@5
        
        mkdir -p www
        cp index.html www/index.html
        
        # Passa o nome que o usuário digitou diretamente para a inicialização do Capacitor
        APP_NAME="${{ github.event.inputs.app_name }}"
        npx cap init "$APP_NAME" com.gerador.app --web-dir www
        npx cap add android
        npx cap sync android

    - name: Aplicar Nome Real e Logo Personalizada
      run: |
        APP_NAME="${{ github.event.inputs.app_name }}"
        
        # 1. Atualiza o strings.xml do Android para o nome aparecer certinho na tela de instalação
        STRINGS_FILE="android/app/src/main/res/values/strings.xml"
        if [ -f "$STRINGS_FILE" ]; then
          sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$APP_NAME<\/string>/" "$STRINGS_FILE"
        fi

        # 2. Se houver logo, substitui os ícones e remove os XMLs de atalho para forçar o uso da imagem
        if [ -f logo.png ]; then
          echo "Aplicando logo personalizada..."
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            MIPMAP_DIR="android/app/src/main/res/mipmap-$d"
            if [ -d "$MIPMAP_DIR" ]; then
              cp logo.png "$MIPMAP_DIR/ic_launcher.png"
              cp logo.png "$MIPMAP_DIR/ic_launcher_round.png"
              # Remove arquivos XML que possam conflitar com a imagem estática
              rm -f "$MIPMAP_DIR/ic_launcher.xml"
              rm -f "$MIPMAP_DIR/ic_launcher_round.xml"
            fi
          done
        fi

    - name: Compilar APK de Debug
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Salvar o APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: meu-aplicativo-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
