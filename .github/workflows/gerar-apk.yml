name: Gerar APK Prático

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar codigo do projeto
      uses: actions/checkout@v4

    - name: Configurar Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Preparar Ambiente Capacitor e Android
      run: |
        npm install -g @capacitor/cli
        npm init -y
        npm install @capacitor/core @capacitor/android
        
        # Cria a estrutura nativa Android se não existir
        if [ ! -d "android" ]; then
          npx cap init MeuApp com.meuapp.gerador --web-dir . --yes
          npx cap add android
        fi

    - name: Sincronizar HTML Atualizado
      run: |
        # Copia o index.html atual da raiz para a pasta web do Android
        npx cap sync android

    - name: Compilar APK de Debug
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Salvar o APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: meu-aplicativo-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
