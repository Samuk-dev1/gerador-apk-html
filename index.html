<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FiadoApp - Controle de Caderneta</title>
    <!-- Tailwind CSS para um design moderno e profissional -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Ajustes para parecer App nativo */
        body {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="flex flex-col h-screen justify-between">

    <!-- Cabeçalho -->
    <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold"><i class="fa-solid fa-book-open mr-2"></i>FiadoApp</h1>
            <p class="text-xs text-indigo-200">Gerenciamento de Caderneta</p>
        </div>
        <button onclick="abrirModalCliente()" class="bg-indigo-500 hover:bg-indigo-400 text-white px-3 py-2 rounded-lg text-sm font-semibold shadow">
            <i class="fa-solid fa-user-plus mr-1"></i> Novo Cliente
        </button>
    </header>

    <!-- Resumo do Caixa/Fiado -->
    <section class="p-4 bg-white border-b shadow-sm grid grid-cols-2 gap-4">
        <div class="bg-red-50 p-3 rounded-xl border border-red-100">
            <span class="text-xs text-red-500 font-bold uppercase">Total a Receber</span>
            <h2 id="totalFiado" class="text-xl font-extrabold text-red-600">R$ 0,00</h2>
        </div>
        <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-100">
            <span class="text-xs text-emerald-500 font-bold uppercase">Clientes Devedores</span>
            <h2 id="totalClientes" class="text-xl font-extrabold text-emerald-600">0</h2>
        </div>
    </section>

    <!-- Barra de Pesquisa -->
    <div class="p-4 pb-0">
        <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                <i class="fa-solid fa-search"></i>
            </span>
            <input type="text" id="buscaCliente" oninput="filtrarClientes()" placeholder="Buscar cliente..." class="w-full pl-10 pr-4 py-2 bg-white border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
    </div>

    <!-- Lista de Clientes -->
    <main class="flex-1 overflow-y-auto p-4 space-y-3" id="listaClientes">
        <!-- Os clientes serão injetados via JavaScript -->
    </main>

    <!-- Modal: Adicionar Cliente -->
    <div id="modalCliente" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl w-full max-w-sm p-5 shadow-xl">
            <h3 class="text-lg font-bold text-gray-800 mb-4">Adicionar Novo Cliente</h3>
            <form onsubmit="salvarCliente(event)">
                <div class="mb-3">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Nome do Cliente</label>
                    <input type="text" id="nomeCliente" required class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Telefone / WhatsApp</label>
                    <input type="tel" id="telCliente" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="flex space-x-2">
                    <button type="button" onclick="fecharModalCliente()" class="w-1/2 bg-gray-200 text-gray-700 py-2 rounded-lg text-sm font-semibold">Cancelar</button>
                    <button type="submit" class="w-1/2 bg-indigo-600 text-white py-2 rounded-lg text-sm font-semibold">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Gerenciar Dívida / Novo Lançamento -->
    <div id="modalDivida" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl w-full max-w-sm p-5 shadow-xl">
            <h3 id="tituloModalDivida" class="text-lg font-bold text-gray-800 mb-2">Conta de [Cliente]</h3>
            <p class="text-xs text-gray-500 mb-4">Saldo atual: <span id="saldoAtualCliente" class="font-bold text-red-600">R$ 0,00</span></p>
            
            <div class="space-y-3 mb-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Valor (R$)</label>
                    <input type="number" step="0.01" id="valorTransacao" placeholder="0.00" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Descrição / Produto</label>
                    <input type="text" id="descricaoTransacao" placeholder="Ex: 2kg de carne, Refrigerante..." class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2 mb-3">
                <button onclick="adicionarDivida()" class="bg-red-600 hover:bg-red-500 text-white py-2 rounded-lg text-xs font-bold uppercase shadow"><i class="fa-solid fa-plus mr-1"></i> Fiado (+)</button>
                <button onclick="realizarPagamento()" class="bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-lg text-xs font-bold uppercase shadow"><i class="fa-solid fa-minus mr-1"></i> Pagar (-)</button>
            </div>
            <button onclick="fecharModalDivida()" class="w-full bg-gray-100 text-gray-600 py-2 rounded-lg text-xs font-semibold">Fechar</button>
        </div>
    </div>

    <!-- Script de Lógica do Sistema -->
    <script>
        let clientes = JSON.parse(localStorage.getItem('fiado_clientes')) || [];
        let clienteAtivoId = null;

        function salvarStorage() {
            localStorage.setItem('fiado_clientes', JSON.stringify(clientes));
            atualizarDashboard();
        }

        function abrirModalCliente() {
            document.getElementById('modalCliente').classList.remove('hidden');
        }

        function fecharModalCliente() {
            document.getElementById('modalCliente').classList.add('hidden');
            document.getElementById('nomeCliente').value = '';
            document.getElementById('telCliente').value = '';
        }

        function salvarCliente(e) {
            e.preventDefault();
            const nome = document.getElementById('nomeCliente').value;
            const telefone = document.getElementById('telCliente').value;

            const novoCliente = {
                id: Date.now(),
                nome,
                telefone,
                saldo: 0,
                historico: []
            };

            clientes.push(novoCliente);
            salvarStorage();
            fecharModalCliente();
            renderizarClientes();
        }

        function renderizarClientes(lista = clientes) {
            const container = document.getElementById('listaClientes');
            container.innerHTML = '';

            if (lista.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 text-gray-400">
                        <i class="fa-solid fa-folder-open text-4xl mb-2"></i>
                        <p class="text-sm">Nenhum cliente cadastrado.</p>
                    </div>`;
                return;
            }

            lista.forEach(cliente => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center";
                card.innerHTML = `
                    <div>
                        <h4 class="font-bold text-gray-800">${cliente.nome}</h4>
                        <p class="text-xs text-gray-500"><i class="fa-solid fa-phone mr-1"></i>${cliente.telefone || 'Sem telefone'}</p>
                    </div>
                    <div class="text-right">
                        <span class="block text-sm font-extrabold ${cliente.saldo > 0 ? 'text-red-600' : 'text-emerald-600'}">
                            R$ ${cliente.saldo.toFixed(2)}
                        </span>
                        <button onclick="abrirModalDivida(${cliente.id})" class="mt-1 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-3 py-1 rounded-lg text-xs font-semibold">
                            Gerenciar
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function abrirModalDivida(id) {
            clienteAtivoId = id;
            const cliente = clientes.find(c => c.id === id);
            document.getElementById('tituloModalDivida').innerText = cliente.nome;
            document.getElementById('saldoAtualCliente').innerText = `R$ ${cliente.saldo.toFixed(2)}`;
            document.getElementById('valorTransacao').value = '';
            document.getElementById('descricaoTransacao').value = '';
            document.getElementById('modalDivida').classList.remove('hidden');
        }

        function fecharModalDivida() {
            document.getElementById('modalDivida').classList.add('hidden');
            clienteAtivoId = null;
            renderizarClientes();
        }

        function adicionarDivida() {
            const valor = parseFloat(document.getElementById('valorTransacao').value);
            const desc = document.getElementById('descricaoTransacao').value || 'Compra fiado';
            if (!valor || valor <= 0) return alert('Digite um valor válido');

            const cliente = clientes.find(c => c.id === clienteAtivoId);
            cliente.saldo += valor;
            cliente.historico.push({ tipo: 'fiado', valor, desc, data: new Date().toLocaleDateString('pt-BR') });
            
            salvarStorage();
            abrirModalDivida(clienteAtivoId);
        }

        function realizarPagamento() {
            const valor = parseFloat(document.getElementById('valorTransacao').value);
            const desc = document.getElementById('descricaoTransacao').value || 'Pagamento parcial/total';
            if (!valor || valor <= 0) return alert('Digite um valor válido');

            const cliente = clientes.find(c => c.id === clienteAtivoId);
            cliente.saldo -= valor;
            cliente.historico.push({ tipo: 'pagamento', valor, desc, data: new Date().toLocaleDateString('pt-BR') });
            
            salvarStorage();
            abrirModalDivida(clienteAtivoId);
        }

        function atualizarDashboard() {
            let totalGeral = 0;
            let devedoresCount = 0;

            clientes.forEach(c => {
                if (c.saldo > 0) {
                    totalGeral += c.saldo;
                    devedoresCount++;
                }
            });

            document.getElementById('totalFiado').innerText = `R$ ${totalGeral.toFixed(2)}`;
            document.getElementById('totalClientes').innerText = devedoresCount;
        }

        function filtrarClientes() {
            const termo = document.getElementById('buscaCliente').value.toLowerCase();
            const filtrados = clientes.filter(c => c.nome.toLowerCase().includes(termo));
            renderizarClientes(filtrados);
        }

        // Inicialização
        renderizarClientes();
        atualizarDashboard();
    </script>
</body>
</html>
