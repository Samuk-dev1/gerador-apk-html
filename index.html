<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Diário Kawaii</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 100vh;
            background-color: #fff9fc;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        @media (min-width: 401px) {
            .game-container {
                height: 750px;
                border-radius: 30px;
            }
        }

        .header {
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 2px dashed #ffb6c1;
        }

        .header h1 {
            color: #d87093;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            font-size: 0.9rem;
            color: #888;
            font-weight: bold;
        }

        .story-box {
            background-color: #fff0f5;
            border: 2px solid #ffb6c1;
            border-radius: 20px;
            padding: 20px;
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #555;
            font-size: 1.1rem;
            line-height: 1.5;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.03);
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        .btn-choice {
            background-color: #ffb6c1;
            color: #fff;
            border: none;
            border-radius: 15px;
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(255, 182, 193, 0.4);
            text-align: center;
        }

        .btn-choice:active {
            transform: scale(0.97);
            background-color: #ff91a4;
        }

        .restart-btn {
            background-color: #dda0dd;
            display: none;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <h1>🌸 Meu Diário Kawaii 🌸</h1>
            <div class="stats">
                <span id="fama-txt">Fama: ❤️ 50</span>
                <span id="energia-txt">Energia: ⚡ 50</span>
            </div>
        </div>

        <div class="story-box" id="story-text">
            Carregando sua história...
        </div>

        <div class="choices-container" id="choices-box">
            <!-- Os botões de escolha vão aparecer aqui dinamicamente -->
        </div>
    </div>

    <script>
        let fama = 50;
        let energia = 50;

        const storyText = document.getElementById("story-text");
        const choicesBox = document.getElementById("choices-box");
        const famaTxt = document.getElementById("fama-txt");
        const energiaTxt = document.getElementById("energia-txt");

        const nodes = {
            inicio: {
                texto: "Hoje é sábado de sol! O que você quer fazer primeiro para aproveitar o seu dia?",
                escolhas: [
                    { texto: "👗 Ir ao shopping comprar um look novo", proximo: "shopping" },
                    { texto: "☕ Encontrar as amigas num café fofinho", proximo: "cafe" },
                    { texto: "🛌 Ficar em casa assistindo doramas", proximo: "casa" }
                ]
            },
            shopping: {
                texto: "Você foi ao shopping e achou um vestido perfeito na vitrine! Como você paga?",
                efeito: () => { fama += 15; energia -= 10; },
                escolhas: [
                    { texto: "Comprar e postar uma foto do look nas redes sociais", proximo: "shopping_foto" },
                    { texto: "Economizar e comprar apenas acessórios fofos", proximo: "shopping_acessorios" }
                ]
            },
            cafe: {
                texto: "O café está delicioso! Suas amigas contam uma fofoca super interessante sobre a escola.",
                efeito: () => { fama += 10; energia += 10; },
                escolhas: [
                    { texto: "Dar a sua opinião sincera e rir muito com elas", proximo: "cafe_rir" },
                    { texto: "Ouvir atenta e pedir um bolo de morango extra", proximo: "cafe_bolo" }
                ]
            },
            casa: {
                texto: "Seu quarto está super aconchegante com luzinhas de led. Qual dorama você maratona?",
                efeito: () => { fama -= 5; energia += 25; },
                escolhas: [
                    { texto: "Um romance colegial bem clichê", proximo: "casa_romance" },
                    { texto: "Um suspense misterioso cheio de reviravoltas", proximo: "casa_misterio" }
                ]
            },
            // Finais / Desdobramentos
            shopping_foto: {
                texto: "Sua foto bombou na internet! Você ganhou centenas de seguidores e fechou o dia como a garota mais estilosa. Fim de jogo perfeito! ✨",
                fim: true
            },
            shopping_acessorios: {
                texto: "Você ficou linda com seus novos acessórios delicados e teve um dia super tranquilo e cheio de paz. Fim de jogo aconchegante! 🌸",
                fim: true
            },
            cafe_rir: {
                texto: "Sua tarde foi cheia de risadas e boas energias. Você se tornou a alma do grupo! Fim de jogo divertido! 💕",
                fim: true
            },
            cafe_bolo: {
                texto: "O bolo estava divino e você passou horas conversando sobre a vida. Um sábado revigorante! Fim de jogo doce! 🍰",
                fim: true
            },
            casa_romance: {
                texto: "Você chorou e suspirou com o final do dorama, mas descansou bastante para a próxima semana. Fim de jogo relaxante! 🌙",
                fim: true
            },
            casa_misterio: {
                texto: "Você desvendou o mistério antes do detetive da série e dormiu como uma verdadeira detetive inteligente! Fim de jogo incrível! 🔍",
                fim: true
            }
        };

        function mostrarNo(nodeKey) {
            const node = nodes[nodeKey];
            
            if (node.efeito) {
                node.efeito();
            }

            famaTxt.innerText = `Fama: ❤️ ${fama}`;
            energiaTxt.innerText = `Energia: ⚡ ${energia}`;
            storyText.innerText = node.texto;
            choicesBox.innerHTML = "";

            if (node.fim) {
                const btnReiniciar = document.createElement("button");
                btnReiniciar.innerText = "🔄 Jogar de Novo";
                btnReiniciar.className = "btn-choice restart-btn";
                btnReiniciar.style.display = "block";
                btnReiniciar.onclick = () => {
                    fama = 50;
                    energia = 50;
                    mostrarNo('inicio');
                };
                choicesBox.appendChild(btnReiniciar);
            } else {
                node.escolhas.forEach(escolha => {
                    const btn = document.createElement("button");
                    btn.className = "btn-choice";
                    btn.innerText = escolha.texto;
                    btn.onclick = () => mostrarNo(escolha.proximo);
                    choicesBox.appendChild(btn);
                });
            }
        }

        // Iniciar o jogo
        mostrarNo('inicio');
    </script>
</body>
</html>
