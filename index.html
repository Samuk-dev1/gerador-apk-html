<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGen APK Generator & Preview Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #030712;
            --surface: rgba(15, 23, 42, 0.85);
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent-glow: #8b5cf6;
            --accent-cyan: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success-color: #00c853;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas de Partículas ao fundo */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Layout Principal Dividido (Lado a Lado) */
        .workspace {
            position: relative;
            z-index: 10;
            display: flex;
            width: 100%;
            min-height: 100vh;
            padding: 30px;
            gap: 30px;
            justify-content: center;
            align-items: center;
        }

        /* ------------------------------------------------ */
        /* LADO ESQUERDO: Pré-visualização do Celular       */
        /* ------------------------------------------------ */
        .preview-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .preview-header {
            margin-bottom: 15px;
            text-align: center;
        }

        .preview-header h2 {
            font-size: 1.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 2px;
        }

        .preview-header p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Celular em Destaque */
        .smartphone-frame {
            width: 320px;
            height: 580px;
            background: #000;
            border: 8px solid #1e293b;
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(139, 92, 246, 0.2);
        }

        .phone-notch {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 20px;
            background: #1e293b;
            border-radius: 10px;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
        }

        .phone-notch::after {
            content: '';
            width: 6px;
            height: 6px;
            background: #030712;
            border-radius: 50%;
        }

        .phone-screen {
            flex: 1;
            background: #ffffff;
            border: none;
            width: 100%;
            height: 100%;
            margin-top: 12px;
        }


        /* ------------------------------------------------ */
        /* LADO DIREITO: Gerador de APK & Editor            */
        /* ------------------------------------------------ */
        .generator-section {
            width: 460px;
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
        }

        .generator-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .generator-header h1 {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00c853 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Campos de Formulário */
        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="file"] {
            width: 100%;
            background: rgba(3, 7, 18, 0.6);
            color: var(--text-main);
            border: 1px solid var(--border-glass);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #8b5cf6;
        }

        input[type="file"] {
            padding: 8px;
            cursor: pointer;
            color: var(--text-muted);
        }

        /* Barra de Ferramentas do Editor (Seletor, Copiar, Colar, Lupa) */
        .editor-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .editor-actions {
            display: flex;
            gap: 4px;
        }

        .btn-tool {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid var(--border-glass);
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.65rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s;
        }

        .btn-tool:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-paste-custom {
            background: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 100%);
            border: none;
            color: white;
        }

        /* Barra de Pesquisa Rápida (Lupa) */
        .search-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            background: rgba(3, 7, 18, 0.4);
            padding: 5px;
            border-radius: 8px;
            border: 1px solid var(--border-glass);
        }

        .search-input-wrapper {
            position: relative;
            flex: 1;
        }

        .search-input-wrapper i {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .search-input {
            width: 100%;
            background: rgba(3, 7, 18, 0.6);
            color: var(--text-main);
            border: 1px solid var(--border-glass);
            border-radius: 6px;
            padding: 5px 6px 5px 24px;
            font-size: 0.75rem;
            outline: none;
        }

        .search-input:focus {
            border-color: #8b5cf6;
        }

        .btn-find-action {
            background: #8b5cf6;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .btn-find-action:hover {
            background: #7c3aed;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: rgba(3, 7, 18, 0.6);
            color: #38bdf8;
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            padding: 12px;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            resize: none;
            outline: none;
            line-height: 1.4;
        }

        textarea:focus {
            border-color: #8b5cf6;
        }

        /* Botão de Gerar APK */
        .btn-gerar-apk {
            margin-top: 15px;
            padding: 14px;
            width: 100%;
            background: var(--success-color);
            color: white;
            border: 0;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 200, 83, 0.3);
            transition: transform 0.1s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-gerar-apk:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .status-text {
            margin-top: 12px;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* Notificação Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(16, 185, 129, 0.9);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 100;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Responsividade para telas menores */
        @media (max-width: 900px) {
            .workspace {
                flex-direction: column;
                padding: 15px;
            }
            .generator-section {
                width: 100%;
                max-width: 420px;
            }
        }
    </style>
</head>
<body>

    <!-- Fundo de Partículas Tech -->
    <canvas id="particles-canvas"></canvas>

    <div class="workspace">
        
        <!-- LADO ESQUERDO: Pré-visualização do Celular -->
        <div class="preview-section">
            <div class="preview-header">
                <h2>Live Mobile Preview</h2>
                <p>Veja como seu aplicativo vai ficar em tempo real</p>
            </div>
            <div class="smartphone-frame">
                <div class="phone-notch"></div>
                <iframe id="preview-screen" class="phone-screen"></iframe>
            </div>
        </div>

        <!-- LADO DIREITO: Painel do Gerador APK & Editor -->
        <div class="generator-section">
            <div class="generator-header">
                <i class="fa-solid fa-rocket" style="font-size: 1.5rem; color: #00c853;"></i>
                <h1>Gerador APK HTML</h1>
            </div>

            <div class="form-group">
                <label class="form-label">NOME DO APLICATIVO</label>
                <input type="text" placeholder="Ex: Meu App Incrível">
            </div>

            <div class="form-group">
                <label class="form-label">ÍCONE DO APLICATIVO</label>
                <input type="file" accept="image/*">
            </div>

            <div class="form-group">
                <div class="editor-toolbar">
                    <label class="form-label" style="margin-bottom:0;">CÓDIGO FONTE HTML</label>
                    <div class="editor-actions">
                        <button class="btn-tool" id="btn-selecionar" title="Selecionar Tudo">
                            <i class="fa-solid fa-check-double"></i> Selecionar
                        </button>
                        <button class="btn-tool" id="btn-copiar" title="Copiar Código">
                            <i class="fa-solid fa-copy"></i> Copiar
                        </button>
                        <button class="btn-tool btn-paste-custom" id="btn-colar" title="Colar Código">
                            <i class="fa-solid fa-paste"></i> Colar
                        </button>
                        <button class="btn-tool" id="btn-limpar" title="Limpar">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>

                <!-- Barra de Pesquisa Rápida (Lupa) -->
                <div class="search-bar" style="margin-top: 6px;">
                    <div class="search-input-wrapper">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="find-input" class="search-input" placeholder="Pesquisar texto no código...">
                    </div>
                    <button class="btn-find-action" id="btn-find">Localizar</button>
                </div>

                <textarea id="html-input" placeholder="Cole seu código HTML aqui..."></textarea>
            </div>

            <button class="btn-gerar-apk" id="btn-gerar">
                <i class="fa-solid fa-cloud-arrow-up"></i> Gerar APK
            </button>

            <p class="status-text" id="status-text">Status: Aguardando...</p>
        </div>

    </div>

    <!-- Notificação Toast -->
    <div id="toast" class="toast">
        <i class="fa-solid fa-check-circle"></i> Ação realizada com sucesso!
    </div>

    <script>
        // Animação de Partículas no Fundo
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.color = Math.random() > 0.5 ? 'rgba(139, 92, 246, 0.35)' : 'rgba(6, 182, 212, 0.35)';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX = -this.speedX;
                if (this.y < 0 || this.y > canvas.height) this.speedY = -this.speedY;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            let numberOfParticles = (canvas.width * canvas.height) / 18000;
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }
        initParticles();

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // Lógica do Preview, Editor e Ferramentas
        const htmlInput = document.getElementById('html-input');
        const previewScreen = document.getElementById('preview-screen');
        const btnSelecionar = document.getElementById('btn-selecionar');
        const btnCopiar = document.getElementById('btn-copiar');
        const btnColar = document.getElementById('btn-colar');
        const btnLimpar = document.getElementById('btn-limpar');
        const findInput = document.getElementById('find-input');
        const btnFind = document.getElementById('btn-find');
        const btnGerar = document.getElementById('btn-gerar');
        const statusText = document.getElementById('status-text');
        const toast = document.getElementById('toast');

        // Exemplo inicial padrão
        const codigoPadrao = `<div style="padding: 24px; font-family: sans-serif; text-align: center; color: #1e293b; margin-top: 20px;">
    <div style="width: 50px; height: 50px; background: linear-gradient(135deg, #00c853, #06b6d4); border-radius: 14px; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; color: white; font-size: 22px; box-shadow: 0 8px 16px rgba(0,200,83,0.3);">
        🚀
    </div>
    <h3 style="font-size: 17px; font-weight: 700; margin-bottom: 6px;">Meu Aplicativo APK</h3>
    <p style="font-size: 11px; color: #64748b; line-height: 1.4; margin-bottom: 14px;">Tudo integrado perfeitamente lado a lado. Pronto para a API do GitHub!</p>
</div>`;

        htmlInput.value = codigoPadrao;

        function atualizarPreview(destacarTermo = '') {
            let codigoHTML = htmlInput.value;

            if (destacarTermo && destacarTermo.trim() !== '') {
                codigoHTML += `
                <script>
                    (function() {
                        const termo = "${destacarTermo}";
                        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
                        let node;
                        while(node = walker.nextNode()) {
                            if(node.nodeValue.includes(termo)) {
                                const parent = node.parentElement;
                                if(parent) {
                                    parent.style.transition = "all 0.3s ease";
                                    parent.style.backgroundColor = "#fef08a";
                                    parent.style.outline = "3px solid #eab308";
                                    parent.style.borderRadius = "4px";
                                    parent.scrollIntoView({behavior: 'smooth', block: 'center'});
                                    setTimeout(() => {
                                        parent.style.backgroundColor = "";
                                        parent.style.outline = "";
                                    }, 2500);
                                    break;
                                }
                            }
                        }
                    })();
                <\/script>`;
            }

            const doc = previewScreen.contentDocument || previewScreen.contentWindow.document;
            doc.open();
            doc.write(codigoHTML);
            doc.close();
        }

        function mostrarToast(msg) {
            toast.innerHTML = `<i class="fa-solid fa-check-circle"></i> ${msg}`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // Ações dos botões
        btnSelecionar.addEventListener('click', () => {
            htmlInput.select();
            htmlInput.setSelectionRange(0, htmlInput.value.length);
            mostrarToast('Todo o texto foi selecionado!');
        });

        btnCopiar.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(htmlInput.value);
                mostrarToast('Código copiado!');
            } catch (err) {
                htmlInput.select();
                document.execCommand('copy');
                mostrarToast('Código copiado!');
            }
        });

        btnColar.addEventListener('click', async () => {
            try {
                const textoCopiado = await navigator.clipboard.readText();
                if (textoCopiado) {
                    htmlInput.value = textoCopiado;
                    atualizarPreview();
                    mostrarToast('Código colado com sucesso!');
                } else {
                    mostrarToast('A área de transferência está vazia.');
                }
            } catch (err) {
                alert('Pressione Ctrl + V dentro do campo para colar seu código.');
            }
        });

        btnLimpar.addEventListener('click', () => {
            htmlInput.value = '';
            atualizarPreview();
            mostrarToast('Editor limpo!');
        });

        // Lupa de Pesquisa Inteligente
        function executarBusca() {
            const termo = findInput.value;
            if (!termo) {
                mostrarToast('Digite o que deseja pesquisar.');
                return;
            }

            const textoCodigo = htmlInput.value;
            const index = textoCodigo.indexOf(termo);

            if (index !== -1) {
                htmlInput.focus();
                htmlInput.setSelectionRange(index, index + termo.length);
                atualizarPreview(termo);
                mostrarToast('Texto localizado no código e na tela!');
            } else {
                mostrarToast('Texto não encontrado.');
            }
        }

        btnFind.addEventListener('click', executarBusca);
        findInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') executarBusca();
        });

        // Simulação do clique do botão Gerar APK (espaço ideal para ligar na API do GitHub)
        btnGerar.addEventListener('click', () => {
            statusText.innerHTML = "Status: <span style='color: #06b6d4;'>Enviando para o GitHub / Compilando...</span>";
            mostrarToast('Iniciando processo de geração do APK...');
            
            setTimeout(() => {
                statusText.innerHTML = "Status: <span style='color: #00c853;'>APK gerado com sucesso! (Pronto para API)</span>";
            }, 2000);
        });

        htmlInput.addEventListener('input', () => atualizarPreview());
        window.onload = () => atualizarPreview();
    </script>
</body>
</html>
