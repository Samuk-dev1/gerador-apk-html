<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TPanel - Mobile App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
            flex-grow: 1;
        }
        /* Tela de carregamento / Splash */
        #loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: opacity 0.4s ease;
            color: #ffffff;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-text {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #94a3b8;
        }
        /* Barra de erro caso falhe a conexão */
        #error-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: #ffffff;
            padding: 24px;
            text-align: center;
        }
        #error-screen h2 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #f87171;
        }
        #error-screen p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        #error-screen button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Tela de Carregamento Inicial -->
        <div id="loader">
            <div class="spinner"></div>
            <div class="loader-text">Carregando TPanel...</div>
        </div>

        <!-- Tela de Erro de Conexão -->
        <div id="error-screen">
            <h2>Ops, algo deu errado</h2>
            <p>Não foi possível carregar o painel. Verifique sua conexão com a internet.</p>
            <button onclick="retryConnection()">Tentar Novamente</button>
        </div>

        <!-- Frame Principal Carregando o Sistema -->
        <iframe id="appFrame" src="https://tpanel.criarsite.online/index.php" allowfullscreen></iframe>
    </div>

    <script>
        const iframe = document.getElementById('appFrame');
        const loader = document.getElementById('loader');
        const errorScreen = document.getElementById('error-screen');

        let loadTimeout = setTimeout(() => {
            // Se demorar muito para carregar, exibe verificação ou esconde o loader mesmo assim
            hideLoader();
        }, 8000);

        iframe.onload = function() {
            clearTimeout(loadTimeout);
            hideLoader();
        };

        iframe.onerror = function() {
            clearTimeout(loadTimeout);
            showError();
        };

        function hideLoader() {
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 400);
        }

        function showError() {
            loader.style.display = 'none';
            errorScreen.style.display = 'flex';
        }

        function retryConnection() {
            errorScreen.style.display = 'none';
            loader.style.display = 'flex';
            iframe.src = iframe.src;
            
            loadTimeout = setTimeout(() => {
                hideLoader();
            }, 8000);
        }
    </script>

</body>
</html>
